# Ported from SS14-Persistence (https://github.com/michaelchessall/SS14-Persistence).
# Prototypes in this file are kept as close to upstream as possible.

- type: reagent
  id: Phoron
  name: reagent-name-phoron
  group: Toxins
  desc: reagent-desc-phoron
  physicalDesc: reagent-physical-desc-gaseous
  flavor: bitter
  color: "#c45a9e"
  recognizable: true
  boilingPoint: -127.3
  meltingPoint: -186.4
  plantMetabolism:
  - !type:PlantAdjustToxins
    amount: 40
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 3
      - !type:AdjustAlert
        alertType: Toxins
        minScale: 2.0
        time: 10
    Respiration:
      effects:
      - !type:HealthChange
        ignoreResistances: true
        damage:
          types:
            Poison: 0.5
  reactiveEffects:
    Flammable:
      methods: [ Touch ]
      effects:
      - !type:Flammable
