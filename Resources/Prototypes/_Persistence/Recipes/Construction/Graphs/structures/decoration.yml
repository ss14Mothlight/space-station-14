# Ported from SS14-Persistence (https://github.com/michaelchessall/SS14-Persistence).
# Prototypes in this file are kept as close to upstream as possible.

- type: constructionGraph
  id: EmployeeMemorial
  start: start
  graph:
    - node: start
      edges:
        - to: employeeMemorial
          completed:
            - !type:SnapToGrid
              southRotation: true
          steps:
            - material: Steel
              amount: 8
              doAfter: 5
            - material: Silver
              amount: 8
              doAfter: 5

    - node: employeeMemorial
      entity: SS13Memorial
      edges:
        - to: start
          completed:
          - !type:SpawnPrototype
                prototype: SheetSteel1
                amount: 8
          - !type:SpawnPrototype
                prototype: IngotSilver1
                amount: 8
          - !type:DeleteEntity {}
          steps:
            - tool: Screwing
              doAfter: 5

- type: constructionGraph
  id: Fireplace
  start: start
  graph:
    - node: start
      edges:
        - to: fireplaceUnfinished
          completed:
            - !type:SnapToGrid
              southRotation: true
          steps:
            - material: Steel
              amount: 8
              doAfter: 5
            - material: WoodPlank
              amount: 4
              doAfter: 5

    - node: fireplaceUnfinished
      entity: FireplaceUnfinished
      edges:
        - to: fireplaceComplete
          steps:
            - tool: Welding
              doAfter: 0.5
        - to: start
          completed:
          - !type:SpawnPrototype
                prototype: SheetSteel1
                amount: 8
          - !type:SpawnPrototype
                prototype: MaterialWoodPlank1
                amount: 4
          - !type:EmptyAllContainers
          - !type:DeleteEntity {}
          steps:
            - tool: Screwing
              doAfter: 2

    - node: fireplaceComplete
      entity: Fireplace
      edges:
        - to: fireplaceUnfinished
          steps:
            - tool: Prying
              doAfter: 4

