# Ported from SS14-Persistence (https://github.com/michaelchessall/SS14-Persistence).
# Prototypes in this file are kept as close to upstream as possible.

- type: constructionGraph
  id: ButtonFrameCautionGraph
  start: start
  graph:
    - node: start
      edges:
        - to: caution
          steps:
            - material: Steel
              amount: 1
              doAfter: 1.0
    - node: caution
      entity: ButtonFrameCaution
      edges:
        - to: start
          steps:
            - tool: Screwing
              doAfter: 1.0
          completed:
            - !type:GivePrototype
              prototype: SheetSteel1
              amount: 1
            - !type:DeleteEntity {}

