- type: constructionGraph
  id: LockableButtonDirectionalGraph
  start: start
  graph:
    - node: start
      edges:
        - to: LockableButtonDirectionalNode
          steps:
            - material: Steel
              amount: 1
              doAfter: 2.0
            - material: ReinforcedGlass
              amount: 1
            - material: Cable
              amount: 1
    - node: LockableButtonDirectionalNode
      entity: LockableButton
      edges:
        - to: start
          conditions:
            - !type:Locked
              locked: false
          steps:
            - tool: Screwing
              doAfter: 2.0
          completed:
            - !type:GivePrototype
              prototype: SheetSteel1
              amount: 1
            - !type:GivePrototype
              prototype: SheetRGlass1
              amount: 1
            - !type:GivePrototype
              prototype: CableApcStack1
              amount: 1
            - !type:DeleteEntity {}
