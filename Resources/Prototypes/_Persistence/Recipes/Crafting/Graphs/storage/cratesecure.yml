# Ported from SS14-Persistence (https://github.com/michaelchessall/SS14-Persistence).
# Prototypes in this file are kept as close to upstream as possible.

- type: constructionGraph
  id: SuitStorageUnit
  start: start
  graph:
    - node: start
      edges:
        - to: suitstorage
          steps:
            - material: Steel
              amount: 5
            - material: Cable
              amount: 2
              doAfter: 5


    - node: suitstorage
      entity: SuitStorageBase
      edges:
        - to: start
          steps:
            - tool: Screwing
              doAfter: 5
          conditions:
            - !type:StorageWelded
              welded: false
            - !type:Locked
              locked: false
          completed:
            - !type:SpawnPrototype
              prototype: SheetSteel1
              amount: 5
            - !type:SpawnPrototype
              prototype: CableApcStack1
              amount: 2
            - !type:EmptyAllContainers
            - !type:DeleteEntity
