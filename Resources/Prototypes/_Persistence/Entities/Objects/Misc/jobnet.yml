# Ported from SS14-Persistence (https://github.com/michaelchessall/SS14-Persistence).
# Prototypes in this file are kept as close to upstream as possible.

- type: entity
  parent: BaseSubdermalImplant
  id: JobNetworkImplant
  name: job network implant
  description: This implant lets the user access the local job network to clock in and out.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionOpenJobNetImplant
  - type: UserInterface
    interfaces:
      enum.JobNetUiKey.Key:
        type: JobNetBoundUserInterface
  - type: JobNet

- type: entity
  id: JobNetworkImplanter
  name: job network implanter
  parent: BaseImplantOnlyImplanter
  components:
  - type: Implanter
    implant: JobNetworkImplant
