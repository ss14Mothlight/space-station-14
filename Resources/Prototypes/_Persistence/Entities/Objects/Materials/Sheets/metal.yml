# Ported from SS14-Persistence (https://github.com/michaelchessall/SS14-Persistence).
# Prototypes in this file are kept as close to upstream as possible.

- type: entity
  parent: SheetMetalBase
  id: SheetAluminium
  name: aluminum
  description: A sheet of aluminum, lightweight and versatile.
  suffix: Full
  components:
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      Aluminium: 100
  - type: Tag
    tags:
    - Sheet
    - Metal
    - ConstructionMaterial
    - Aluminum
  - type: Stack
    stackType: Aluminium
    baseLayer: base
    layerStates:
    - titanium
    - titanium_2
    - titanium_3
  - type: Sprite
    sprite: _Persistence/Objects/Materials/Sheets/metal.rsi # Mothlight: the inherited sheet lacks these states
    state: titanium_3
    layers:
    - state: titanium_3
      map: ["base"]
  - type: Item
    heldPrefix: titanium
  - type: Appearance
  - type: Extractable
    grindableSolutionName: aluminium
  - type: SolutionContainerManager
    solutions:
      aluminium:
        reagents:
        - ReagentId: Aluminium
          Quantity: 10
        canReact: false

