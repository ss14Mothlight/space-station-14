      ReinforcedPhoronGlass: 100
  - type: Stack
    stackType: ReinforcedPhoronGlass
    baseLayer: base
    layerStates:
    - rphoronglass
    - rphoronglass_2
    - rphoronglass_3
  - type: Sprite
    sprite: _Persistence/Objects/Materials/Sheets/glass.rsi # Mothlight: the inherited sheet lacks these states
    state: rphoronglass_3
    layers:
    - state: rphoronglass_3
      map: ["base"]
  - type: Item
    heldPrefix: rphoronglass
  - type: Construction
    graph: Glass
    node: SheetRPhoronGlass
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -4
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassPlasma:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Extractable
    grindableSolutionName: rphoronglass
  - type: SolutionContainerManager
    solutions:
      rphoronglass:
        reagents:
        - ReagentId: Silicon
          Quantity: 10
        - ReagentId: Plasma
          Quantity: 6
        - ReagentId: Bananium
          Quantity: 6
        - ReagentId: Titanium
          Quantity: 3
        - ReagentId: Iron
          Quantity: 4.5
        - ReagentId: Carbon
          Quantity: 0.5
        - ReagentId: Phoron
          Quantity: .5 # Max expected yield of 1.1
        canReact: false

- type: entity
  parent: SheetRPhoronGlass
  id: SheetRPhoronGlass1
  name: reinforced phoron glass
  suffix: Single
  components:
  - type: Sprite
    sprite: _Persistence/Objects/Materials/Sheets/glass.rsi # Mothlight: the inherited sheet lacks these states
    state: rphoronglass
  - type: Stack
    stackType: ReinforcedPhoronGlass
    count: 1
