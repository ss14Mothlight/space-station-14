# Ported from SS14-Persistence (https://github.com/michaelchessall/SS14-Persistence).
# Prototypes in this file are kept as close to upstream as possible.

- type: entity
  parent: OreBase
  id: AluminumOre
  name: aluminum ore
  suffix: Full
  components:
  - type: Stack
    stackType: AluminumOre
  - type: Sprite
    sprite: _Persistence/Objects/Materials/ore.rsi # Mothlight: the inherited sheet lacks these states
    state: aluminum
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      RawAluminum: 100
  - type: Extractable
    grindableSolutionName: aluminumore
  - type: SolutionContainerManager
    solutions:
      aluminumore:
        reagents:
        - ReagentId: Aluminium
          Quantity: 6.5
  - type: Item
    heldPrefix: aluminum
  - type: Tag
    tags:
    - Ore

- type: entity
  parent: AluminumOre
  id: AluminumOre1
  suffix: Single
  components:
  - type: Stack
    count: 1

