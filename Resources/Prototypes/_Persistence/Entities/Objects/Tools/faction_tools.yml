- type: entity
  parent: BaseItem
  id: StationTagger
  name: faction tagger
  description: Used to link specific machines and structures with a station.
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/multitool_drop.ogg
  - type: Sprite
    sprite: _Persistence/Objects/Tools/faction-tagger.rsi
