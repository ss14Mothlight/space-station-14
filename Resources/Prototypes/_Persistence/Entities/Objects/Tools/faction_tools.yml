    interfaces:
      enum.StationTaggerUiKey.Key:
        type: StationTaggerBoundUserInterface
  - type: ActivatableUI
    key: enum.StationTaggerUiKey.Key
    requiresComplex: true
    requireActiveHand: false
    singleUser: true
    inHandsOnly: true
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      StationTagger-privilegedId: !type:ContainerSlot
  - type: PhysicalComposition
    materialComposition:
      Plastic: 50
      Steel: 100
