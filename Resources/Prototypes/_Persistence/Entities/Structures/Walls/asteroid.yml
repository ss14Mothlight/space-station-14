# Ported from SS14-Persistence (https://github.com/michaelchessall/SS14-Persistence).
# Prototypes in this file are kept as close to upstream as possible.

- type: entity
  id: AsteroidRockAluminum
  parent: AsteroidRock
  description: An ore vein rich with aluminum.
  suffix: Aluminum
  components:
  - type: OreVein
    oreChance: 1.0
    currentOre: OreAluminum
  - type: Sprite
    layers:
    - state: rock_asteroid
    - map: [ "enum.EdgeLayer.South" ]
      state: rock_asteroid_south
    - map: [ "enum.EdgeLayer.East" ]
      state: rock_asteroid_east
    - map: [ "enum.EdgeLayer.North" ]
      state: rock_asteroid_north
    - map: [ "enum.EdgeLayer.West" ]
      state: rock_asteroid_west
    - state: rock_lead
      map: [ "enum.MiningScannerVisualLayers.Overlay" ]

