# Ported from SS14-Persistence (https://github.com/michaelchessall/SS14-Persistence).
# Prototypes in this file are kept as close to upstream as possible.

- type: entity
  id: BronzeGirder
  parent: Girder
  name: bronze girder
  description: A structural girder made from bronze; It requires bronze plating before it can be considered a wall.
  components:
    - type: Sprite
      sprite: _Persistence/Structures/walls/girders.rsi
      state: bronzegirder
    - type: Construction
      graph: Girder
      node: bronzeGirder
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 200
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
        - trigger:
            !type:DamageTrigger
            damage: 50
          behaviors:
            - !type:SpawnEntitiesBehavior
              spawn:
                SheetBronze1:
                  min: 1
                  max: 1
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
    - type: StaticPrice
      price: 40
    - type: IconSmooth
      key: walls
      base: bronzegirder

- type: entity
  id: GirderDiagonal
  parent: Girder
  name: diagonal girder
  description: A large structural assembly made out of metal; It requires a layer of metal before it can be considered a wall.
  components:
  - type: Rotatable
  - type: Sprite
    sprite: _Persistence/Structures/Walls/girder_diagonal.rsi
    state: state0
  - type: Tag
    tags:
    - Diagonal
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
            vertices:
            - "-0.5,-0.5"
            - "0.5,0.5"
            - "0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Construction
    graph: GirderDiagonal
    node: girder
  - type: IconSmooth
    mode: Diagonal
    key: walls
    base: state

- type: entity
  id: ReinforcedGirderDiagonal
  parent: ReinforcedGirder
  name: diagonal reinforced girder
  description: A large structural assembly made out of metal and plasteel; It requires a layer of plasteel before it can be considered a reinforced wall.
  components:
  - type: Rotatable
  - type: Sprite
    sprite: _Persistence/Structures/Walls/reinforced_girder_diagonal.rsi
    state: state0
  - type: Tag
    tags:
    - Diagonal
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
            vertices:
            - "-0.5,-0.5"
            - "0.5,0.5"
            - "0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Construction
    graph: GirderDiagonal
    node: reinforcedGirder
  - type: IconSmooth
    mode: Diagonal
    key: walls
    base: state
