# Ported from SS14-Persistence (https://github.com/michaelchessall/SS14-Persistence).
# Prototypes in this file are kept as close to upstream as possible.

- type: entity
  parent: BaseWall
  id: WallShuttleTitanium
  name: titanium shuttle wall
  components:
  # Mothlight: it deconstructs into more than the inherited wall price, a bit above a regular shuttle wall's 300.
  - type: StaticPrice
    price: 350
  - type: Sprite
    sprite: _Persistence/Structures/walls/titanium-shuttle-wall.rsi
    state: icon
  - type: Icon
    sprite: _Persistence/Structures/walls/titanium-shuttle-wall.rsi
    state: icon
  - type: IconSmooth
    key: walls
    base: wall
  - type: Appearance
  - type: WallReplacementMarker
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: RadiationBlocker
    resistance: 5
  - type: Reflect
    reflectProb: 1
  - type: GenericVisualizer
    visuals:
      enum.ReinforcedWallVisuals.DeconstructionStage:
        ReinforcedWallVisualLayers.Deconstruction:
          -1: { visible: false }
          0: { state: construct-0, visible: true}
          1: { state: construct-1, visible: true}
          2: { state: construct-2, visible: true}
          3: { state: construct-3, visible: true}
          4: { state: construct-4, visible: true}
          5: { state: construct-5, visible: true}
  - type: Construction
    node: titaniumShuttleWall
    graph: Girder

- type: entity
  id: WallShuttleTitaniumDiagonal
  parent: WallDiagonalBase
  name: titanium shuttle wall
  suffix: Diagonal
  components:
  # Mothlight: it deconstructs into more than the inherited wall price, a bit above a regular shuttle wall's 300.
  - type: StaticPrice
    price: 350
  - type: Sprite
    drawdepth: Walls
    sprite: _Persistence/Structures/walls/titanium-shuttle-wall.rsi
    state: diagonal-0
  - type: Icon
    sprite: _Persistence/Structures/walls/titanium-shuttle-wall.rsi
    state: diagonal-0
  - type: Construction
    graph: GirderDiagonal
    node: titaniumShuttleWallDiagonal
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: reinforcedGirder
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: IconSmooth
    mode: Diagonal
    key: walls
    base: diagonal-
