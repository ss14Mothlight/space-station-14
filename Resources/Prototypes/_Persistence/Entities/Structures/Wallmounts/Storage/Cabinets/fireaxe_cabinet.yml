# Ported from SS14-Persistence (https://github.com/michaelchessall/SS14-Persistence).
# Prototypes in this file are kept as close to upstream as possible.

- type: entity
  parent: BaseWallmountGlass
  id: FireAxeCabinetAssembly
  name: fire axe cabinet assembly
  description: The unfinished assembly for a fireaxe cabinet. Axe sold separately.
  placement:
    mode: SnapgridCenter
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 200 #20ish crowbar hits
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  - type: Sprite
    sprite: Structures/Wallmounts/fireaxe_cabinet.rsi
    state: cabinet
  - type: Construction
    graph: FireAxeCabinetGraph
    node: glass
