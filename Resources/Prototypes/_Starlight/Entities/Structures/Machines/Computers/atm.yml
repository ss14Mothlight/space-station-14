- type: entity
  parent: BaseComputerAiAccess
  id: ATM
  categories: [ ShouldMapStation ]
  name: atm
  description: A regular ATM, it eats spesos and spits them back out. # Mothlight - Persistence bank ATM
  placement:
    mode: SnapgridCenter
    snap:
    - Wallmount
  components:
  # Mothlight begin - Persistence bank ATM, in spesos
  - type: BankATM
    cashSlot:
      name: bank-ATM-cashSlot
      insertSound: /Audio/Machines/scanning.ogg
      ejectSound: /Audio/Machines/tray_eject.ogg
      ejectOnBreak: true
      swap: false
      whitelist:
        components:
        - Cash
  # Mothlight end
  - type: WallMount
    arc: 360
  - type: Sprite
    sprite: _Starlight/Structures/Machines/atm.rsi
    layers:
    - map: ["computerLayerBody"]
      state: offline
    - map: ["computerLayerScreen"]
      state: unshaded
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerScreen:
          True: { visible: true, shader: unshaded }
          False: { visible: false }
  # Mothlight begin - Persistence bank ATM
  - type: ActivatableUI
    key: enum.BankATMMenuUiKey.ATM
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.BankATMMenuUiKey.ATM:
        type: BankATMBoundUserInterface
  # Mothlight end
  - type: PointLight
    enabled: true
    radius: 1.5
    energy: 1.6
    color: "#57A3F7"
  - type: Rotatable
    rotateWhileAnchored: false
