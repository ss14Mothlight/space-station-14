# Machines: these also need a board so the machine graph can take them apart and put them back together.
# Unlike Persistence, the fans stay unpowered, it only makes them buildable.
- type: !PartialOnly entity
  id: Recycler
  components:
  - type: Machine
    board: RecyclerMachineCircuitboard
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: Construction
    graph: Machine
    node: machine
    containers:
    - machine_parts
    - machine_board

- type: !PartialOnly entity
  id: AtmosDeviceFanTiny
