# Gives existing entities the construction/deconstruction they have on SS14-Persistence.
# The graphs and recipes themselves live in _Persistence/Recipes; this only attaches them.
# Partials on a parent cover every variant that inherits from it (listed above each one).

- type: !PartialOnly entity
  id: AirlockAssemblyMining
  components:
  - type: Construction
    graph: AirlockMining
    node: assembly

- type: !PartialOnly entity
  id: AirlockAssemblyMiningGlass
  components:
  - type: Construction
    graph: AirlockMining
    node: assembly

